name: Windows build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'mediaforge').version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match Cargo version' }
          if (-not (Test-Path "docs/releases/$env:GITHUB_REF_NAME.md")) { throw 'Release notes missing' }
      - name: Download and verify FFmpeg 9.0
        run: |
          $ffmpeg = ./scripts/fetch-ffmpeg.ps1
          "MEDIAFORGE_TEST_FFMPEG=$ffmpeg" >> $env:GITHUB_ENV
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests including real media, pause and cancellation
        run: cargo test --locked --all-targets -- --include-ignored --test-threads=1
      - name: Build portable ZIP
        run: ./scripts/package.ps1 -FfmpegPath $env:MEDIAFORGE_TEST_FFMPEG
      - name: Verify extracted package
        run: ./scripts/verify-package.ps1
      - name: Archive checksum
        run: |
          $zip = 'dist/MediaForge-windows-x64.zip'
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  MediaForge-windows-x64.zip" | Set-Content dist/MediaForge-windows-x64.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: MediaForge-windows-x64
          path: |
            dist/MediaForge-windows-x64.zip
            dist/MediaForge-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MediaForge-windows-x64
          path: dist
      - name: Publish tested Windows package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/MediaForge-windows-x64.zip dist/MediaForge-windows-x64.zip.sha256 --verify-tag --title "MediaForge $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
